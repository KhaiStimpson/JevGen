name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release --logger "trx;LogFileName=results.trx" --collect:"XPlat Code Coverage"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/**"

  aot:
    name: Native AOT
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install the native toolchain
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      # Publishing alone proves little. The failures worth catching here -- reflection over
      # attributes, runtime generic instantiation, reflection-based serialization -- only show up
      # once the binary runs, so the binary runs.
      - name: Publish the AOT test
        run: dotnet publish tests/JevGen.AotTests -c Release -r linux-x64

      - name: Execute the native binary
        run: ./tests/JevGen.AotTests/bin/Release/net10.0/linux-x64/publish/JevGen.AotTests

      - name: Publish the Native AOT sample
        run: dotnet publish samples/NativeAot -c Release -r linux-x64

      - name: Execute the sample
        run: ./samples/NativeAot/bin/Release/net10.0/linux-x64/publish/JevGen.Samples.NativeAot

  samples:
    name: Samples
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - run: dotnet build -c Release

      # Every console sample runs offline against the testing package, so a sample that stops
      # working is caught here rather than by a reader.
      - name: Run the samples
        run: |
          for sample in TicketRouting FraudDetection ContentModeration AgentToolRouting; do
            echo "::group::$sample"
            dotnet run --project "samples/$sample" --no-build -c Release
            echo "::endgroup::"
          done

      - name: Inspect a contract with the CLI
        run: |
          dotnet run --project src/JevGen.Cli --no-build -c Release -- \
            inspect samples/TicketRouting/bin/Release/net10.0/TicketRouting.dll
          dotnet run --project src/JevGen.Cli --no-build -c Release -- \
            validate samples/TicketRouting/bin/Release/net10.0/TicketRouting.dll

  pack:
    name: Pack
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - run: dotnet pack -c Release -o artifacts

      # A package that installs cleanly and silently generates nothing is the worst failure
      # mode there is, so the packages are checked from a consumer's point of view.
      - name: Verify the packages
        run: ./eng/verify-packages.sh

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/*.nupkg
